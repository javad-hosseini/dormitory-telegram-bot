services:
  dormitory-bot:
    image: dormitory-telegram-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dormitory-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data:z
      - ./incoming_spreadsheets:/app/incoming_spreadsheets:z
    environment:
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

